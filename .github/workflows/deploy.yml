name: Deploy (GitHub Pages)

# 배포 절차는 docs/DEPLOY.md 참고. main 에서 수동 실행한다:
#   gh workflow run "Deploy (GitHub Pages)" --ref main
# (github-pages 환경은 main 브랜치의 배포만 허용한다. 태그 푸시로는 배포할 수 없어 트리거에서 뺐다.)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
